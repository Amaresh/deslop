pack_id: deslop-python-fastapi-v1
version: "0.1.0"
invocation: explicit
install_namespace: deslop

# Skills-only pack: no engine detectors exist for these rules yet, so nothing
# is gated. Promote a rule to the root engine.rule_ids only once an
# agent-written sample fails scripts/check.py.
engine:
  rule_ids: []

frameworks:
  - fastapi
  - pydantic
  - httpx

# Repos that already carry their own agent-rule setup; install refuses these
# unless --force. Extend with your org's markers.
collisions:
  - .cursor/rules/my-org-python-rules.mdc

# checker: an agent-written sample already fails scripts/check.py.
# teach-only: skill may teach it; CI must not fail on it yet.
skills:
  - name: no-sync-blocking-io-in-async-route
    rule_id: python.asyncio.no-sync-blocking-io-in-async-def-route
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-httpx-asyncclient-without-timeout
    rule_id: python.http.no-httpx-client-without-explicit-timeout
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-except-exception-pass
    rule_id: python.reliability.no-except-exception-pass-swallow
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-fstring-sql-interpolation
    rule_id: python.sql.no-fstring-sql-interpolation
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-post-validation-model-mutation
    rule_id: python.pydantic.no-post-validation-model-mutation
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-fire-and-forget-task-without-cancellation
    rule_id: python.asyncio.no-fire-and-forget-task-without-cancellation
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-secret-defaults-in-settings
    rule_id: python.security.no-secret-values-as-config-defaults
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-route-without-response-model
    rule_id: python.fastapi.no-route-without-response-model
    globs: "**/*.py"
    enforcement: teach-only
