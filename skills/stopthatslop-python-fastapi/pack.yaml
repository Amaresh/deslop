pack_id: stopthatslop-python-fastapi-v1
version: "0.2.0"
invocation: model
install_namespace: stopthatslop
lang: python

engine:
  rule_ids: []

mine:
  rule_ids:
    - python.asyncio.no-sync-blocking-io-in-async-def-route
    - python.http.no-httpx-client-without-explicit-timeout
    - python.reliability.no-except-exception-pass-swallow
    - python.security.no-dynamic-sql-execution
    - python.reliability.no-route-request-json-without-invalid-json-guard
    - python.security.no-raw-pii-logging
    - python.architecture.no-request-layer-outbound-client-construction
    - python.http.no-requests-call-without-timeout

frameworks:
  - fastapi
  - pydantic
  - httpx

# checker: portable AST detector, 0 unjustified OSS FPs; CI fails.
# teach-only: skill may teach it; CI must not fail on it yet.
skills:
  - name: no-sync-blocking-io-in-async-route
    rule_id: python.asyncio.no-sync-blocking-io-in-async-def-route
    globs: "**/*.py"
    enforcement: checker
  - name: no-httpx-asyncclient-without-timeout
    rule_id: python.http.no-httpx-client-without-explicit-timeout
    globs: "**/*.py"
    enforcement: checker
  - name: no-except-exception-pass
    rule_id: python.reliability.no-except-exception-pass-swallow
    globs: "**/*.py"
    enforcement: checker
  - name: no-dynamic-sql-execution
    rule_id: python.security.no-dynamic-sql-execution
    globs: "**/*.py"
    enforcement: checker
  - name: no-route-request-json-without-invalid-json-guard
    rule_id: python.reliability.no-route-request-json-without-invalid-json-guard
    globs: "**/*.py"
    enforcement: checker
  - name: no-raw-pii-logging
    rule_id: python.security.no-raw-pii-logging
    globs: "**/*.py"
    enforcement: checker
  - name: no-request-layer-outbound-client-construction
    rule_id: python.architecture.no-request-layer-outbound-client-construction
    globs: "**/*.py"
    enforcement: checker
  - name: no-requests-call-without-timeout
    rule_id: python.http.no-requests-call-without-timeout
    globs: "**/*.py"
    enforcement: checker
  - name: no-fstring-sql-interpolation
    rule_id: python.sql.no-fstring-sql-interpolation
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-post-validation-model-mutation
    rule_id: python.pydantic.no-post-validation-model-mutation
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-fire-and-forget-task-without-cancellation
    rule_id: python.asyncio.no-fire-and-forget-task-without-cancellation
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-secret-defaults-in-settings
    rule_id: python.security.no-secret-values-as-config-defaults
    globs: "**/*.py"
    enforcement: teach-only
  - name: no-route-without-response-model
    rule_id: python.fastapi.no-route-without-response-model
    globs: "**/*.py"
    enforcement: teach-only
