# Self-dogfood: pytest + pack checker. A broken detector must fail this job.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install stopthatslop
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Pack checker
        run: stopthatslop check --repo-root . --pack all
