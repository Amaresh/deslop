pack_id: stopthatslop-java-spring-v1
version: "0.3.0"
invocation: model
install_namespace: stopthatslop
lang: java

# G0.3: check uses checkers/ only. Do not reintroduce a house RulesEngine here.
engine:
  rule_ids: []

mine:
  rule_ids:
    - java.reliability.no-jpql-null-or-lower-on-optional-filter
    - java.architecture.no-service-layer-transactional-external-io
    - java.architecture.no-service-layer-rest-template-without-timeout-shaping
    - java.performance.no-n-plus-one-without-entity-graph
    - java.jpa.no-query-string-concatenation
    - java.correctness.no-file-upload-without-validation
    - java.security.no-secret-fallback-literal
    - java.security.no-raw-pii-logging
    - java.performance.no-eager-to-many-fetch
    - java.architecture.no-controller-direct-repository-access
    - java.reliability.no-unbounded-findall-without-pagination
    - java.reliability.no-after-commit-dispatch-from-after-commit-listener

frameworks:
  - spring
  - jpa

# Repos that already carry their own agent-rule setup; install refuses these
# unless --force. Extend with your org's markers.
collisions:
  - .cursor/rules/my-org-java-rules.mdc

# checker: detector exists and OSS unjustified FPs are gone; CI fails.
# teach-only: skill may teach it; CI must not fail on it yet.
skills:
  - name: no-jpql-null-or-lower
    rule_id: java.reliability.no-jpql-null-or-lower-on-optional-filter
    globs: "**/*Repository.java"
    enforcement: checker
  - name: no-transactional-external-io
    rule_id: java.architecture.no-service-layer-transactional-external-io
    globs: "**/*Service.java"
    enforcement: checker
  - name: no-rest-template-without-timeout
    rule_id: java.architecture.no-service-layer-rest-template-without-timeout-shaping
    globs: "**/*Service.java"
    enforcement: checker
  - name: no-n-plus-one-without-entity-graph
    rule_id: java.performance.no-n-plus-one-without-entity-graph
    globs: "**/*.java"
    enforcement: checker
  - name: no-query-string-concatenation
    rule_id: java.jpa.no-query-string-concatenation
    globs: "**/*.java"
    enforcement: checker
  - name: no-file-upload-without-validation
    rule_id: java.correctness.no-file-upload-without-validation
    globs: "**/*.java"
    enforcement: checker
  - name: no-secret-fallback-literal
    rule_id: java.security.no-secret-fallback-literal
    globs: "**/*.java"
    enforcement: checker
  - name: no-java-raw-pii-logging
    rule_id: java.security.no-raw-pii-logging
    globs: "**/*.java"
    enforcement: checker
  - name: no-eager-to-many-fetch
    rule_id: java.performance.no-eager-to-many-fetch
    globs: "**/*.java"
    enforcement: checker
  - name: no-controller-direct-repository-access
    rule_id: java.architecture.no-controller-direct-repository-access
    globs: "**/*Controller.java"
    enforcement: checker
  - name: no-unbounded-findall-without-pagination
    rule_id: java.reliability.no-unbounded-findall-without-pagination
    globs: "**/*.java"
    enforcement: checker
  - name: no-after-commit-dispatch-from-after-commit-listener
    rule_id: java.reliability.no-after-commit-dispatch-from-after-commit-listener
    globs: "**/*.java"
    enforcement: checker
